services:
  - type: web
    name: supplyiq-flask-api
    runtime: python
    rootDir: backend/python-flask
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "18009"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        value: defaultdb
      - key: MYSQL_SSL_REQUIRED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
